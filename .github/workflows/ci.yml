name: Tests and Build Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run type-check
        run: npm run type-check

      - name: Run tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: test # Solo se ejecuta si el job "test" tiene éxito

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Start application
        run: npm start &
        env:
          CI: true

      - name: Wait for application to be ready
        run: npx wait-on http://localhost:5173

      - name: Run Cypress tests
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e] # Solo se ejecuta si los jobs "test" y "e2e" tienen éxito
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
